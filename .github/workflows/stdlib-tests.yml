name: stdlib-tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run review-desk tests without third-party packages
        run: python -m unittest discover -s tests -t .
